[package]
name = "reason-network"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
toml_edit = "0.25.17"
webpki-roots = "1.0.11"

[dev-dependencies]
tempfile = "3.27.0"
