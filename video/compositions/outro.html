  <script>
    const grid = document.getElementById("ou-grid");
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const lit = [], edge = [], inner = [];
    for (let r = 0; r < 11; r++) {
      for (let c = 0; c < 30; c++) {
        const el = document.createElement("i");
        el.className = "ou-c";
        grid.appendChild(el);
        const isInner = r >= 2 && r <= 8 && c >= 5 && c <= 24;
        (isInner ? inner : edge).push(el);
        if (rnd() < 0.45) lit.push(el);
      }
    }
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(".ou-c", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", stagger: { each: 0.0015, from: "center" } }, 0);
    tl.to(lit, { backgroundColor: "#2563ff", duration: 0.2, stagger: { each: 0.004, from: "random" } }, 0.25);
    // the middle clears into a frame for the mark
    tl.to(inner, { opacity: 0, scale: 0.4, duration: 0.3, ease: "power2.in", stagger: { each: 0.002, from: "center" } }, 1.0);
    tl.to(edge, { opacity: 0.35, duration: 0.4 }, 1.6);

    window.__timelines["outro"] = tl;
